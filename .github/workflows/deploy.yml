name: Build e deploy Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EIXOSPGESTAOFROTAS }}
          project_id: eixospgestaofrotas
      - run: npx firebase-tools deploy --only firestore:rules --project eixospgestaofrotas
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EIXOSPGESTAOFROTAS }}
          projectId: eixospgestaofrotas
          channelId: live
