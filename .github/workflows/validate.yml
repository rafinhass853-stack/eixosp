name: Validar frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/anexos-otimizacao-firestore"]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar build
        run: npm run build
      - name: Validar lint
        run: npm run lint
